[project]
name = "vambe-backend"
version = "0.1.0"
description = "Vambe Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.34.0",
    "anthropic>=0.40.0",
    "fastapi>=0.115.14",
    "google-genai>=1.0.0",
    "hf-transfer>=0.1.8",
    "openai>=1.50.0",
    "opentelemetry-instrumentation-fastapi>=0.55b1",
    "pydantic[email]>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
