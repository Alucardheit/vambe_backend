services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vambe_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - vambe_network

networks:
  vambe_network:
    driver: bridge
